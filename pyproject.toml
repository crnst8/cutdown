[project]
name = "cutdown"
version = "1.0.0"
description = "Transcript-to-clips edit harness for track-anchored interview segments"
requires-python = ">=3.11"
dependencies = [
    # A static ffmpeg that Homebrew upgrades cannot break; used when no system
    # ffmpeg runs (see cutdown/media.py).
    "imageio-ffmpeg>=0.5",
    "pyyaml>=6.0",
    "textual>=0.80",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
cutdown = "cutdown.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cutdown"]
